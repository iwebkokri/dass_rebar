<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="t d">
  <title id="t">Dass Rebar website</title>
  <desc id="d">Dass Rebar: a Next.js website with a visual page builder, a WordPress-style admin, SEO and AI tools, email and lead capture.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#20385f"/>
      <stop offset="1" stop-color="#0e182e"/>
    </linearGradient>
    <linearGradient id="rod" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d6dade"/>
      <stop offset=".45" stop-color="#919CA4"/>
      <stop offset="1" stop-color="#4f5a64"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0e182e" stop-opacity="1"/>
      <stop offset=".42" stop-color="#0e182e" stop-opacity=".92"/>
      <stop offset="1" stop-color="#0e182e" stop-opacity="0"/>
    </linearGradient>
    <pattern id="rib" width="26" height="30" patternUnits="userSpaceOnUse" patternTransform="skewX(-38)">
      <rect width="8" height="30" fill="#0e182e" opacity=".42"/>
    </pattern>
    <pattern id="mesh" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#919CA4" stroke-opacity=".07" stroke-width="1"/>
    </pattern>
    <clipPath id="card"><rect width="1280" height="320" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1280" height="320" fill="url(#bg)"/>
    <rect width="1280" height="320" fill="url(#mesh)"/>

    <!-- cross bars (stirrups) -->
    <g fill="url(#rod)" opacity=".55">
      <rect x="900" y="-10" width="12" height="340" rx="6"/>
      <rect x="1010" y="-10" width="12" height="340" rx="6"/>
      <rect x="1200" y="-10" width="12" height="340" rx="6"/>
    </g>
    <!-- ribbed rods -->
    <g>
      <rect x="800" y="58"  width="540" height="26" rx="13" fill="url(#rod)"/>
      <rect x="800" y="58"  width="540" height="26" rx="13" fill="url(#rib)"/>
      <rect x="880" y="140" width="460" height="26" rx="13" fill="url(#rod)"/>
      <rect x="880" y="140" width="460" height="26" rx="13" fill="url(#rib)"/>
      <rect x="830" y="222" width="510" height="26" rx="13" fill="url(#rod)"/>
      <rect x="830" y="222" width="510" height="26" rx="13" fill="url(#rib)"/>
    </g>
    <!-- fade the rods out toward the text -->
    <rect x="0" y="0" width="1000" height="320" fill="url(#fade)"/>

    <!-- text -->
    <g font-family="Inter, Manrope, 'Segoe UI', Helvetica, Arial, sans-serif">
      <text x="72" y="112" font-size="20" font-weight="700" letter-spacing="7" fill="#B0A18E">DASS</text>
      <text x="68" y="188" font-size="82" font-weight="800" fill="#FFFFFF">Rebar</text>
      <text x="72" y="236" font-size="23" font-weight="500" fill="#DCDFE3">Visual page builder  ·  WordPress-style admin  ·  SEO, email &amp; leads</text>
      <text x="72" y="272" font-size="15" font-weight="600" letter-spacing="3" fill="#919CA4">NEXT.JS 16  ·  NODE.JS  ·  SQLITE</text>
    </g>

    <!-- brand colour strip -->
    <g>
      <rect x="0"       y="310" width="213.4" height="10" fill="#182845"/>
      <rect x="213.4"   y="310" width="213.4" height="10" fill="#DCDFE3"/>
      <rect x="426.8"   y="310" width="213.4" height="10" fill="#919CA4"/>
      <rect x="640.2"   y="310" width="213.4" height="10" fill="#7F5F47"/>
      <rect x="853.6"   y="310" width="213.4" height="10" fill="#B0A18E"/>
      <rect x="1067"    y="310" width="213"   height="10" fill="#8D8E55"/>
    </g>
  </g>
</svg>
