<svg xmlns="http://www.w3.org/2000/svg" width="980" height="152" viewBox="0 0 980 152" role="img" aria-labelledby="t">
  <title id="t">Dass Rebar brand colours: navy #182845, light grey #DCDFE3, steel #919CA4, brown #7F5F47, tan #B0A18E, olive #8D8E55</title>
  <rect width="980" height="152" rx="16" fill="#F6F7F9" stroke="#E1E4E8"/>
  <g transform="translate(10 14)" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">
    <g>
      <rect x="4"   y="4" width="144" height="70" rx="12" fill="#182845"/>
      <text x="76"  y="98"  font-size="14" font-weight="700" fill="#182845">Navy</text>
      <text x="76"  y="118" font-size="13" fill="#5b6470">#182845</text>
    </g>
    <g>
      <rect x="164" y="4" width="144" height="70" rx="12" fill="#DCDFE3" stroke="#c4c9cf"/>
